<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buddy — AI Chat</title>
<style>
  :root {
    --bg: #0A0E17;
    --bg-glow: radial-gradient(900px 500px at 50% -10%, rgba(124, 111, 240, 0.16), transparent);
    --panel: #12172A;
    --accent: #7C6FF0;
    --accent-dark: #5B4FD1;
    --text: #E7E9F3;
    --muted: #8B93A7;
    --border: #232A45;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-glow), var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .shell {
    width: 100%; max-width: 720px;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 20px 16px;
  }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #4C3FBD);
    box-shadow: 0 0 18px rgba(124, 111, 240, 0.45);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px;
  }
  .brand-name { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .brand-sub { font-size: 0.76rem; color: var(--muted); }

  #chatLog {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    padding: 6px 4px 16px;
  }
  .msg {
    max-width: 82%; padding: 11px 15px; border-radius: 16px;
    font-size: 0.93rem; line-height: 1.55;
    animation: bb-fade-in 0.2s ease-out;
  }
  @keyframes bb-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.ai p { margin: 0 0 8px; }
  .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai ul { margin: 4px 0 8px; padding-left: 20px; }
  .msg.ai li { margin-bottom: 4px; }
  .msg.ai strong { color: #fff; }
  .msg.ai code { background: rgba(124,111,240,0.15); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }

  .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bb-blink 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bb-blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .empty-hint { margin: auto; text-align: center; color: var(--muted); font-size: 0.9rem; max-width: 320px; line-height: 1.5; }

  .input-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 8px 6px 18px;
  }
  .input-row input[type=text] { flex: 1; border: none; background: none; outline: none; font-size: 0.93rem; color: var(--text); }
  .input-row input::placeholder { color: var(--muted); }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); border: 1px solid var(--accent);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--accent-dark); }
  svg { width: 17px; height: 17px; }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand-mark">B</div>
    <div>
      <div class="brand-name">Buddy</div>
      <div class="brand-sub">AI chat</div>
    </div>
  </header>

  <div id="chatLog">
    <div class="empty-hint" id="emptyHint">Say hi to get started.</div>
  </div>

  <div class="input-row">
    <input type="text" id="chatInput" placeholder="Message Buddy..." />
    <button class="icon-btn" id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>
    </button>
  </div>
</div>

<script>
// =====================================================================
// PASTE YOUR GROQ KEY HERE. Edit this line in VS Code, save, then open
// this file in a browser (or redeploy it). Get a key at console.groq.com
// =====================================================================
const GROQ_API_KEY = "PASTE_YOUR_GROQ_KEY_HERE";
// =====================================================================

// This persona is the main lever for making replies feel human instead of
// robotic — tune the wording below to change Buddy's voice/personality.
const PERSONA = `You are Buddy — a sharp, warm, genuinely curious conversational partner. Talk like a
smart friend texting back, not a customer-service script.

Rules for how you write:
- Use contractions and natural sentence rhythm. Vary sentence length — don't make every sentence the same shape.
- Never open with throat-clearing like "Great question!", "I'd be happy to help", or "As an AI...". Just answer.
- Match your length to the question. A quick question gets 1-3 sentences. Something genuinely complex earns more —
  broken into short paragraphs, or a tight bulleted list only when a list actually helps, never as a default format.
- Have opinions and a little personality where it fits naturally — don't hedge everything into mush.
- Ask a follow-up question only when it genuinely moves the conversation forward, not as a reflexive habit.
- Don't end every reply with "let me know if you need anything else" or similar filler — let the conversation breathe.
- If you don't know something, just say so plainly instead of padding around it.`;

let history = [];
const chatLog = document.getElementById("chatLog");

// ---- lightweight formatting so replies read like real text, not a wall ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function formatReply(raw) {
  let text = escapeHtml(raw);
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  const blocks = text.split(/\n\s*\n/);
  return blocks.map(block => {
    const lines = block.split("\n").filter(l => l.trim());
    const isList = lines.length > 1 && lines.every(l => /^[-*]\s+/.test(l.trim()));
    if (isList) {
      const items = lines.map(l => `<li>${l.trim().replace(/^[-*]\s+/, "")}</li>`).join("");
      return `<ul>${items}</ul>`;
    }
    return `<p>${block.replace(/\n/g, "<br>")}</p>`;
  }).join("");
}

function appendUserMsg(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function appendTyping() {
  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

async function sendMessage(text) {
  if (!text.trim()) return;
  if (!GROQ_API_KEY || GROQ_API_KEY === "PASTE_YOUR_GROQ_KEY_HERE") {
    const div = document.createElement("div");
    div.className = "msg ai";
    div.textContent = "No Groq key set yet — open this file in VS Code and paste your key into the GROQ_API_KEY line near the top of the <script> section.";
    chatLog.appendChild(div);
    return;
  }

  const emptyHint = document.getElementById("emptyHint");
  if (emptyHint) emptyHint.remove();

  appendUserMsg(text);
  history.push({ role: "user", content: text });

  const thinking = appendTyping();

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${GROQ_API_KEY}`,
      },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: PERSONA }, ...history.slice(-12)],
        max_tokens: 500,
        temperature: 0.85,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      thinking.textContent = "Error: " + (data.error?.message || "request failed. Check your Groq key.");
      return;
    }
    const reply = data.choices?.[0]?.message?.content?.trim() || "...";
    thinking.innerHTML = formatReply(reply);
    chatLog.scrollTop = chatLog.scrollHeight;
    history.push({ role: "assistant", content: reply });
  } catch (err) {
    thinking.textContent = "Couldn't reach Groq. Check your internet connection.";
  }
}

document.getElementById("sendBtn").onclick = () => {
  const input = document.getElementById("chatInput");
  sendMessage(input.value);
  input.value = "";
};
document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
});
</script>
</body>
</html>
